# Смоук-тесты: обязательные для авто-PR контура самоулучшения.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Смоук-тест
        run: node tests/smoke.js
